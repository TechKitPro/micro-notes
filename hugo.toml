baseURL = 'https://micro-notes.pages.dev/'
title = 'Micro Notes'
theme = 'PaperMod'
defaultContentLanguage = 'zh'
hasCJKLanguage = true
timeZone = 'Asia/Shanghai'
paginate = 10

[languages]
  [languages.zh]
    label = "简体中文"
    weight = 1
    [[languages.zh.menu.main]]
      identifier = "home"
      name = "首页"
      url = "/"
      weight = 1
    [[languages.zh.menu.main]]
      identifier = "categories"
      name = "分类"
      url = "/categories/"
      weight = 2
    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/tags/"
      weight = 3
    [[languages.zh.menu.main]]
      identifier = "about"
      name = "关于"
      url = "/about/"
      weight = 4

[params]
  mainSections = ["posts"]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/TechKitPro"

[outputs]
  home = ["HTML", "RSS"]

[taxonomies]
  category = "categories"
  tag = "tags"
