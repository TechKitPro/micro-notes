baseURL = 'https://micro-notes.pages.dev/'
title = 'Micro Notes'
theme = 'PaperMod'
defaultContentLanguage = 'zh'
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
paginate = 10
timeZone = 'Asia/Shanghai'

[languages]
  [languages.zh]
    label = "简体中文"
    weight = 1
    [languages.zh.params]
      description = "记录技术点滴"
    [[languages.zh.menu.main]]
      identifier = "home"
      name = "首页"
      url = "/"
      weight = 1
    [[languages.zh.menu.main]]
      identifier = "archives"
      name = "归档"
      url = "/archives/"
      weight = 2
    [[languages.zh.menu.main]]
      identifier = "categories"
      name = "分类"
      url = "/categories/"
      weight = 3
    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/tags/"
      weight = 4
    [[languages.zh.menu.main]]
      identifier = "about"
      name = "关于"
      url = "/about/"
      weight = 5

[params]
  env = "production"
  title = "Micro Notes"
  description = "基于 Hugo 构建的技术笔记博客，记录编程、开发与学习心得"
  author = "TechKitPro"
  keywords = ["技术博客", "笔记", "编程", "开发"]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowFullTextinRSS = true
  comments = false
  assets.disableHLJS = false
  homeInfoParams = { Title = "Micro Notes", Content = "记录技术点滴 | 编程、开发与学习心得" }
  socialIcons = [
    { name = "github", url = "https://github.com/TechKitPro" }
  ]

  [params.editPost]
    URL = "https://github.com/TechKitPro/micro-notes/tree/main/content"
    Text = "建议修改"
    appendFilePath = true

  [params.fuseOpts]
    ignoreLocation = true
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"
