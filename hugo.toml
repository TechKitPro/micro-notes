baseURL = 'https://micro-notes.pages.dev/'
title = 'Micro Notes'
theme = 'stack'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
paginate = 10
timeZone = 'Asia/Shanghai'
copyright = 'TechKitPro'

[languages]
  [languages."zh-cn"]
    label = "简体中文"
    weight = 1
    [languages."zh-cn".params]
      description = "记录技术点滴"
    [[languages."zh-cn".menu.main]]
      identifier = "home"
      name = "首页"
      url = "/"
      weight = 1
    [[languages."zh-cn".menu.main]]
      identifier = "archives"
      name = "归档"
      url = "/archives/"
      weight = 2
    [[languages."zh-cn".menu.main]]
      identifier = "categories"
      name = "分类"
      url = "/categories/"
      weight = 3
    [[languages."zh-cn".menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/tags/"
      weight = 4
    [[languages."zh-cn".menu.main]]
      identifier = "about"
      name = "关于"
      url = "/about/"
      weight = 5

[params]
  [params.sidebar]
    emoji = "📝"
    subtitle = "记录技术点滴 | 编程、开发与学习心得"
    avatar = "https://bu.dusays.com/2023/04/27/64496e511b09c.jpg"
    [params.sidebar.links]
      github = "https://github.com/TechKitPro"

  [params.article]
    readingTime = true
    wordCount = true
    [params.article.license]
      enabled = true
      default = "CC BY-NC-SA 4.0"
    [params.article.math]
      enable = false

  [params.footer]
    since = 2026
    customText = "由 Hugo + Stack 主题驱动"

  [params.colorScheme]
    toggle = true

  [params.image]
    process = "resize 2000x"
    [params.image.lightGallery]
      enable = true
      [params.image.lightGallery.options]
        selector = ".article-image"

  [params.search]
    enable = true
    type = "fuse"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"
