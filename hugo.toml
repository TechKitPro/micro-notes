baseURL = 'https://micro-notes.pages.dev/'
locale = 'zh-cn'
title = 'Micro Notes'
theme = 'stack'
paginate = 10
enableRobotsTXT = true

[params]
  description = '基于 Hugo 构建的技术笔记博客，记录编程、开发与学习心得'
  author = 'TechKitPro'
  keywords = ['技术博客', '笔记', '编程', '开发']
  defaultImage = ''
  [params.dateFormat]
    published = '2006-01-02'
    lastModified = '2006-01-02'

[params.sidebar]
  emoji = '📝'
  subtitle = '记录技术点滴'
  avatar = ''

[params.footer]
  since = 2026
  customText = 'Powered by Hugo · Theme Stack'

[params.comments]
  enabled = false

[params.widgets]
  enabled = ['search', 'archives', 'tag-cloud', 'categories']

[menu]
  [[menu.main]]
    identifier = 'home'
    name = '首页'
    url = '/'
    weight = 1
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 2
  [[menu.main]]
    identifier = 'categories'
    name = '分类'
    url = '/categories/'
    weight = 3
  [[menu.main]]
    identifier = 'tags'
    name = '标签'
    url = '/tags/'
    weight = 4
  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 5

[markup]
  [markup.highlight]
    style = 'github'
    lineNos = true
    codeFences = true
    guessSyntax = true
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ['HTML', 'RSS']
