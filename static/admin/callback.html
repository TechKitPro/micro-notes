<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>登录中...</title>
</head>
<body>
  <p>正在登录，请稍候...</p>
  <script>
    // 从 URL hash 中解析 token
    var hash = window.location.hash.substring(1);
    var params = {};
    hash.split('&').forEach(function(pair) {
      var parts = pair.split('=');
      params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
    });

    if (params.access_token) {
      // 通过 postMessage 把 token 传给主窗口
      window.opener.postMessage({
        action: 'loginSuccess',
        token: params.access_token,
        provider: 'github'
      }, '*');

      // 关闭 popup 窗口
      setTimeout(function() {
        window.close();
      }, 500);
    } else {
      document.body.innerHTML = '<p>登录失败：未获取到 access token</p>';
    }
  </script>
</body>
</html>
