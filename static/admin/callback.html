<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>登录中...</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .status { font-size: 18px; margin-bottom: 20px; }
    .debug { font-size: 12px; color: #666; margin-top: 20px; max-width: 400px; word-break: break-all; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="status" id="status">正在登录，请稍候...</div>
  <button id="manualBtn" style="display:none;">手动完成登录</button>
  <div class="debug" id="debug"></div>

  <script>
    // 从 URL hash 中解析 token
    var hash = window.location.hash.substring(1);
    var params = {};
    hash.split('&').forEach(function(pair) {
      var parts = pair.split('=');
      params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
    });

    var debugEl = document.getElementById('debug');
    var statusEl = document.getElementById('status');
    var manualBtn = document.getElementById('manualBtn');

    function sendToken() {
      if (!params.access_token) {
        statusEl.textContent = '登录失败：未获取到 access token';
        debugEl.textContent = 'Hash: ' + hash;
        return false;
      }

      debugEl.textContent = 'Token: ' + params.access_token.substring(0, 20) + '...\nOpener: ' + (window.opener ? '存在' : 'null');

      // Decap CMS 标准消息格式（同时发送 code 和 token）
      var message = {
        code: params.access_token,
        token: params.access_token,
        provider: 'github'
      };

      try {
        window.opener.postMessage(message, '*');
        statusEl.textContent = '登录成功！正在关闭...';
        setTimeout(function() { window.close(); }, 1000);
        return true;
      } catch (e) {
        debugEl.textContent += '\nError: ' + e.message;
        return false;
      }
    }

    // 自动发送
    var sent = sendToken();

    // 如果自动发送失败，显示手动按钮
    if (!sent) {
      manualBtn.style.display = 'block';
      manualBtn.onclick = sendToken;
    }

    // 3秒后如果还没关闭，显示手动按钮
    setTimeout(function() {
      if (!window.closed) {
        manualBtn.style.display = 'block';
        statusEl.textContent = '如果没有自动登录，请点击下方按钮';
      }
    }, 3000);
  </script>
</body>
</html>
